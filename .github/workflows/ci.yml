
name: CI - Cloud Native

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Code and Dockerfile lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: market-service
            dockerfile: market-service/Dockerfile
          - service: trading-service
            dockerfile: trading-service/Dockerfile
          - service: market-updater
            dockerfile: market-updater/Dockerfile
          - service: frontend
            dockerfile: frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Python code
        if: matrix.service != 'frontend'
        uses: astral-sh/ruff-action@v3
        with:
          src: ${{ matrix.service }}
          args: check --select E4,E7,E9,F

      - name: Install Hadolint
        run: |
          wget -O hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x hadolint
          sudo mv hadolint /usr/local/bin/hadolint

      - name: Check Dockerfile
        run: hadolint "${{ github.workspace }}/${{ matrix.dockerfile }}"

  tests:
    name: Unit tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: market-service
            test-dir: tests
          - service: trading-service
            test-dir: tests
          - service: market-updater
            test-dir: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          python -m pytest -p pytest_cov ${{ matrix.test-dir }}/ -v --cov=app --cov-report=term

  build:
    name: Build and publish Docker images
    runs-on: ubuntu-latest
    needs:
      - lint
      - tests

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: market-service
            image: cc-practica-market-service
          - service: trading-service
            image: cc-practica-trading-service
          - service: market-updater
            image: cc-practica-market-updater
          - service: frontend
            image: cc-practica-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/yasmine9ms/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
