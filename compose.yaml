
name: cryptosim

services:
    redis:
        image: redis:7.4.12-alpine
        networks:
            - internal

    database:
        image: postgres:17.11-alpine3.23
        restart: unless-stopped
        environment:
            POSTGRES_DB: cryptosim
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
        networks:
            - internal

    reverse-proxy:
        image: nginx:stable-alpine
        ports:
            - "8080:80"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        networks:
            - internal
            - public
        depends_on:
            - market-service
            - trading-service

    market-updater:
        build: ./market-updater
        restart: unless-stopped
        environment:
            COIN_GECKO_API_KEY: ${COIN_GECKO_API_KEY}
            REDIS_HOST: ${REDIS_HOST}
            REDIS_PORT: ${REDIS_PORT}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            REDIS_DB: ${REDIS_DB}
        networks:
            - internal
        depends_on:
            - redis

    market-service:
        build: ./market-service
        restart: unless-stopped
        environment:
            REDIS_HOST: ${REDIS_HOST}
            REDIS_PORT: ${REDIS_PORT}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            REDIS_DB: ${REDIS_DB}
        networks:
            - internal
        depends_on:
            - redis

    trading-service:
        build: ./trading-service
        restart: unless-stopped
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=cryptosim
            - HOST=${HOST}
            - REDIS_HOST=${REDIS_HOST}
            - REDIS_PORT=${REDIS_PORT}
            - REDIS_PASSWORD=${REDIS_PASSWORD}
            - REDIS_DB=${REDIS_DB}
            - JWT_SECRET=${JWT_SECRET}
        networks:
            - internal
        depends_on:
            - database
            - redis

    frontend:
        build: ./frontend
        networks:
            - internal
        depends_on:
            - market-service
            - trading-service

volumes:
    postgres_data:

networks:
    internal:
    public:
