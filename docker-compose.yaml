name: cryptosim

services:
    redis:
        image: redis:7.4.12-alpine
        networks:
            - internal
    database:
        image: postgres:17.11-alpine3.23
        restart: unless-stopped
        environment:
            POSTGRES_DB: cryptosim
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - internal
    reverse-proxy:
        image: nginx:stable-alpine
        ports:
            - "8080:80"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        networks:
            - internal
            - public
        depends_on:
            - market-service
            - trading-service
    market-service:
        build: ./market-service
        networks:
            - internal
        depends_on:
            - redis
    trading-service:
        build: ./trading-service
        networks:
            - internal
        depends_on:
            - database
            - redis
volumes:
    postgres_data:

networks:
    internal:
    public:
        


